name: Build Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Dependency audit (runtime packages)
        run: npm audit --omit=dev --audit-level=high

  # Real browser check: on-device OCR and PDF reading under the app's own strict CSP.
  browser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright-core
      - run: node scripts/copy-ocr-assets.mjs
      - run: node scripts/smoke.mjs

  android:
    needs: [test, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      # Keeps the same debug signing key between builds, so a new APK installs over the old one without uninstalling.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tempo-debug-keystore-v1
      - run: npm run build
      - run: npx cap add android
      - run: node scripts/harden-android.mjs
        env:
          SECURE_WINDOW: 'true' # set to 'false' if you want to take screenshots of the app
      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            ./gradlew assembleRelease
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --out ../tempo-release.apk "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No signing key found. Building a debug APK (installable, but see README to sign it)."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../tempo-debug.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tempo-apk
          path: tempo-*.apk
          retention-days: 14
